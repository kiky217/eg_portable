<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description"><title id="title">Evaluation Gateway illustrative step verification view</title><desc id="description">A conceptual operator view showing that an accepted first step is verified, a second step fails POST and stays open, and the next step stays locked. All task identifiers and statuses are illustrative, not live telemetry.</desc>
<rect x="0" y="0" width="1200" height="630" rx="16" fill="#0E1721" stroke="none"/>
<rect x="1" y="1" width="1198" height="628" rx="16" fill="none" stroke="#324352"/>
<rect x="0" y="0" width="1200" height="66" rx="16" fill="#152433" stroke="none"/>
<rect x="0" y="55" width="1200" height="11" rx="0" fill="#152433" stroke="none"/>
<line x1="0" y1="66" x2="1200" y2="66" stroke="#263849" stroke-width="1"/>
<rect x="30" y="23" width="18" height="18" rx="4" fill="#48C6A2" stroke="none"/>
<text x="62" y="38" fill="#F3F7FA" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Evaluation Gateway</text>
<text x="1170" y="38" fill="#8EACBD" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="end">INTERFACE CONCEPT • NOT LIVE DATA</text>
<text x="42" y="114" fill="#F3F7FA" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">Verification belongs in the workflow.</text>
<text x="42" y="145" fill="#A8BAC9" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">A command result is not a verified outcome.</text>
<rect x="42" y="175" width="1116" height="42" rx="8" fill="#1A2B3A" stroke="none"/>
<text x="64" y="203" fill="#98B1C4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">STEP</text>
<text x="360" y="203" fill="#98B1C4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">READINESS (PRE)</text>
<text x="578" y="203" fill="#98B1C4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">TRUSTED EXECUTION</text>
<text x="836" y="203" fill="#98B1C4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">RESULT (POST)</text>
<text x="1086" y="203" fill="#98B1C4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">STATE</text>
<rect x="42" y="229" width="1116" height="86" rx="7" fill="#142430" stroke="none"/>
<rect x="61" y="248" width="36" height="29" rx="5" fill="#2B4254" stroke="none"/>
<text x="79" y="268" fill="#DCE9F2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">01</text>
<text x="115" y="264" fill="#E7F1F7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Confirm prerequisites</text>
<text x="115" y="289" fill="#91A9BC" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Evidence matches task criteria</text>
<text x="360" y="269" fill="#55D3A4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">VERIFIED</text>
<text x="578" y="269" fill="#C3D8EA" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">RECEIPT SIGNED</text>
<text x="836" y="269" fill="#55D3A4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">VERIFIED</text>
<text x="1086" y="269" fill="#55D3A4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">COMPLETE</text>
<rect x="42" y="325" width="1116" height="100" rx="7" fill="#1F2932" stroke="none"/>
<rect x="61" y="344" width="36" height="29" rx="5" fill="#2B4254" stroke="none"/>
<text x="79" y="364" fill="#DCE9F2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">02</text>
<text x="115" y="360" fill="#E7F1F7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Check deployment result</text>
<text x="115" y="385" fill="#91A9BC" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Acceptance criterion not met</text>
<text x="360" y="365" fill="#55D3A4" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">VERIFIED</text>
<text x="578" y="365" fill="#C3D8EA" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">RECEIPT SIGNED</text>
<text x="836" y="365" fill="#FF937B" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">FAILED</text>
<text x="1086" y="365" fill="#FFAB90" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">OPEN</text>
<rect x="42" y="435" width="1116" height="86" rx="7" fill="#142430" stroke="none"/>
<rect x="61" y="454" width="36" height="29" rx="5" fill="#2B4254" stroke="none"/>
<text x="79" y="474" fill="#DCE9F2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">03</text>
<text x="115" y="470" fill="#E7F1F7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Continue to next step</text>
<text x="115" y="495" fill="#91A9BC" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Cannot advance past failed POST</text>
<text x="360" y="475" fill="#91A9BC" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">NOT STARTED</text>
<text x="578" y="475" fill="#91A9BC" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">—</text>
<text x="836" y="475" fill="#91A9BC" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">—</text>
<text x="1086" y="475" fill="#B2C2CD" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">LOCKED</text>
<line x1="42" y1="544" x2="1158" y2="544" stroke="#263849" stroke-width="1"/>
<text x="42" y="581" fill="#FFAC92" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">STEP 02 • POST FAILED</text>
<text x="42" y="607" fill="#D6E1E9" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Reconcile or repair. Re-verify before proceeding.</text>
<text x="1157" y="590" fill="#8FADBE" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="end">EG / verification-first</text>
</svg>