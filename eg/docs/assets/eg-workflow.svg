<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" role="img" aria-labelledby="title desc"><title id="title">EG step-by-step verification workflow</title><desc id="desc">Register task, verify PRE, execute with an admitted worker, validate signed receipt, check POST, and only then advance. Failed POST keeps step open for reconciliation or repair.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#778DA2" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="318" fill="#F7F9FB" rx="12"/>
<text x="28" y="38" fill="#637588" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start">HOW A STEP MOVES THROUGH EG</text>
<rect x="27" y="69" width="204" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
<text x="129" y="102" fill="#162B3D" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">REGISTER</text>
<text x="129" y="125" fill="#5B7184" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Task + criteria</text>
<path d="M236 108 L253 108" fill="none" stroke="#778DA2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="263" y="69" width="204" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
<text x="365" y="102" fill="#162B3D" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">PRE</text>
<text x="365" y="125" fill="#5B7184" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Readiness verified</text>
<path d="M472 108 L489 108" fill="none" stroke="#778DA2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="499" y="69" width="204" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
<text x="601" y="102" fill="#162B3D" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">EXECUTE</text>
<text x="601" y="125" fill="#5B7184" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Admitted worker</text>
<path d="M708 108 L725 108" fill="none" stroke="#778DA2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="735" y="69" width="204" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
<text x="837" y="102" fill="#162B3D" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">RECEIPT</text>
<text x="837" y="125" fill="#5B7184" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Signed worker receipt</text>
<path d="M944 108 L961 108" fill="none" stroke="#778DA2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="971" y="69" width="204" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/>
<text x="1073" y="102" fill="#162B3D" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">POST</text>
<text x="1073" y="125" fill="#5B7184" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Check acceptance</text>
<path d="M1073 147 V178 H735" stroke="#778DA2" stroke-width="2" fill="none"/>
<circle cx="735" cy="178" r="4" fill="#778DA2"/>
<path d="M735 178 V202" stroke="#778DA2" stroke-width="2"/>
<rect x="145" y="207" width="406" height="73" rx="11" fill="#EAF7F1" stroke="#B9E6CF" stroke-width="1.5"/>
<rect x="649" y="207" width="406" height="73" rx="11" fill="#FFF1ED" stroke="#F4C9BD" stroke-width="1.5"/>
<text x="348" y="237" fill="#1F654A" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">PASS → NEXT STEP</text>
<text x="348" y="260" fill="#437766" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Advance only after verified evidence.</text>
<text x="852" y="237" fill="#9D4B39" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">FAIL → STEP REMAINS OPEN</text>
<text x="852" y="260" fill="#986658" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Reconcile / repair, then verify again.</text>
<path d="M735 178 H348 V201" stroke="#6EAB91" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<path d="M735 178 H852 V201" stroke="#D39B8A" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<text x="26" y="307" fill="#62788B" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Diagram illustrates control flow; it does not represent a running deployment.</text>
</svg>