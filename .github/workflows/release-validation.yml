name: EG release validation

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eg-release-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked runtime
        working-directory: eg
        run: |
          python -m pip install --only-binary=:all: \
            --require-hashes -r requirements.lock
      - name: Install test-only dependencies
        run: python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Unit and regression suite
        working-directory: eg
        env:
          PYTHONPATH: ".:tests"
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Prepare world-readable source for separate-UID test runners
        run: |
          sudo install -d -m 0755 /tmp/eg-ci-source
          sudo cp -R eg/app eg/docs eg/tools eg/VERSION /tmp/eg-ci-source/
          sudo chmod -R a+rX /tmp/eg-ci-source
      - name: Trusted executor E2E (isolated test runtime only)
        run: sudo env PYTHONPATH=/tmp/eg-ci-source "$(command -v python)" /tmp/eg-ci-source/tools/run_trusted_e2e.py
      - name: Remediation E2E (isolated test runtime only)
        run: sudo env PYTHONPATH=/tmp/eg-ci-source "$(command -v python)" /tmp/eg-ci-source/tools/run_remedial_e2e.py
