name: EG validation and stable release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eg-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Archive complete canonical source for reproducible local tests
        run: |
          git archive --format=tar.gz --output="eg-source-${{ github.sha }}.tar.gz" HEAD
          sha256sum "eg-source-${{ github.sha }}.tar.gz" > "eg-source-${{ github.sha }}.tar.gz.sha256"
          sha256sum -c "eg-source-${{ github.sha }}.tar.gz.sha256"
      - name: Upload exact canonical source
        uses: actions/upload-artifact@v4
        with:
          name: eg-source-${{ github.sha }}
          path: |
            eg-source-${{ github.sha }}.tar.gz
            eg-source-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Generate source-pinned hardcode candidate inventory
        run: python eg/tools/audit_hardcodes.py --output audit/hardcode-candidates.json --matrix-output audit/literal-disposition-matrix.jsonl
      - name: Upload hardcode audit candidates
        uses: actions/upload-artifact@v4
        with:
          name: eg-hardcode-audit-${{ github.sha }}
          path: |
            audit/hardcode-candidates.json
            audit/literal-disposition-matrix.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Install hash-locked runtime
        working-directory: eg
        run: |
          python -m pip install --only-binary=:all: \
            --require-hashes -r requirements.lock
      - name: Install test-only dependencies
        run: python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Single-agent canonical PRE execute-once POST acceptance
        working-directory: eg
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_single_agent_workflow.py
      - name: Generic EG core provider and host path boundaries
        working-directory: eg
        run: python -m pytest -q tests/test_generic_core_boundaries.py
      - name: Regression suite including bundle safety
        working-directory: eg
        env:
          PYTHONPATH: .:tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Verify notary signing under separate OS identity
        working-directory: eg
        env:
          PYTHONPATH: .:tests
        run: sudo env PYTHONPATH=.:tests "$(command -v python)" -m pytest -q tests/test_notary_domain_e2e.py
      - name: Live distinct UID adapter attestation and peer credential boundary
        working-directory: eg
        run: sudo env PYTHONPATH=.:tests "$(command -v python)" -m pytest -q tests/test_adapter_cross_uid_live.py
      - name: External high-effect independent UID PRE execute POST
        working-directory: eg
        run: sudo env PYTHONPATH=.:tests "$(command -v python)" -m pytest -q tests/test_external_uid_roundtrip.py tests/test_process_external_e2e.py
      - name: Bound E3 processes leave no live descendants
        working-directory: eg
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_process_group_cleanup.py
      - name: Prepare isolated separate-UID test source
        run: |
          sudo install -d -m 0755 /tmp/eg-ci-source
          sudo cp -R eg/app eg/docs eg/tools eg/VERSION /tmp/eg-ci-source/
          sudo chmod -R a+rX /tmp/eg-ci-source
      - name: Independent operator-scoped standing E3 signing policy
        working-directory: eg
        run: sudo env PYTHONPATH=.:tests EG_TEST_SOURCE=/tmp/eg-ci-source "$(command -v python)" -m pytest -q tests/test_operator_scoped_approval.py tests/test_provision_scoped_signer.py
      - name: Root operator first-use signed worker provisioning and identity isolation
        working-directory: eg
        run: sudo env PYTHONPATH=.:tests EG_TEST_SOURCE=/tmp/eg-ci-source "$(command -v python)" -m pytest -q tests/test_operator_first_run.py
      - name: E2 independent unprivileged controller signed PRE POST
        working-directory: eg
        run: sudo env PYTHONPATH=.:tests EG_E2_TEST_SOURCE=/tmp/eg-ci-source "$(command -v python)" -m pytest -q tests/test_e2_controller_group.py
      - name: Signed executor E2E
        run: sudo env PYTHONPATH=/tmp/eg-ci-source "$(command -v python)" /tmp/eg-ci-source/tools/run_trusted_e2e.py
      - name: Remedial E2E
        run: sudo env PYTHONPATH=/tmp/eg-ci-source "$(command -v python)" /tmp/eg-ci-source/tools/run_remedial_e2e.py
      - name: Build and smoke production Docker runtime imports
        run: |
          docker build -t eg-runtime-smoke eg
          docker run --rm -i --entrypoint python eg-runtime-smoke - <<'PY'
          import os, importlib.util
          from app.main import app
          from tools.high_effect_admission import AdapterCapability
          from tools.adapter_liveness import probe_unix
          from tools.signed_hitl_approval import verify_approval
          assert os.geteuid() == 10001
          assert app.version
          assert importlib.util.find_spec("tools.disposable_effect_adapter") is None
          assert importlib.util.find_spec("tools.disposable_rpc_worker") is None
          PY
      - name: Build portable archive against Debian Bookworm glibc
        run: |
          docker run --rm -v "$PWD:/source" -w /source/eg python:3.12.15-slim-bookworm /bin/sh -ec '
            umask 077
            python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r requirements.lock
            # Reproduce a private build environment; published modules must
            # still work for a separate, non-root service identity.
            chmod -R go-rwx /usr/local/lib/python3.12/site-packages
            python tools/build_portable_bundle.py
          '
          version="$(cat eg/VERSION)"
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          sha256sum "eg-portable-${version}-linux-amd64.tar.gz" > "eg-portable-${version}-linux-amd64.tar.gz.sha256"
          sha256sum -c "eg-portable-${version}-linux-amd64.tar.gz.sha256"
      - name: Verify offline relocation
        working-directory: eg
        run: sudo env PYTHONPATH=. "$(command -v python)" tools/test_offline_portable.py
      - name: Clean Debian offline smoke without build-host Python
        run: |
          version="$(cat eg/VERSION)"
          docker run --rm --network none -v "$PWD/dist:/distribution:ro" debian:bookworm-slim /bin/sh -ec "
            test ! -e /usr/bin/python3
            mkdir -p /tmp/release
            tar -xzf /distribution/eg-portable-${version}-linux-amd64.tar.gz -C /tmp/release
            /tmp/release/eg-portable-${version}-linux-amd64/python.sh -c 'import sys,ssl,sqlite3,cryptography; print(sys.version)'
          "
      - name: Upload verified bundle for exact source SHA
        uses: actions/upload-artifact@v4
        with:
          name: eg-release-${{ github.sha }}
          path: |
            dist/eg-portable-*.tar.gz
            dist/eg-portable-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish_stable:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout verified SHA
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-tags: true
      - name: Download exactly validated bundle
        uses: actions/download-artifact@v4
        with:
          name: eg-release-${{ github.sha }}
          path: dist
      - name: Publish only new stable version; keep previous releases immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat eg/VERSION)"
          tag="v${version}"
          archive="dist/eg-portable-${version}-linux-amd64.tar.gz"
          checksum="${archive}.sha256"
          (cd dist && sha256sum -c "$(basename "$checksum")")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$release_target" != "$GITHUB_SHA" ]; then
              echo "::error title=VERSION_BUMP_REQUIRED::Immutable $tag targets $release_target, but CI tested $GITHUB_SHA; bump eg/VERSION before publishing"
              exit 1
            fi
            echo "IMMUTABLE_RELEASE_EXACT_SHA_MATCH: $tag"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "TAG_EXISTS_WITHOUT_RELEASE; refusing to retarget"
            exit 1
          fi
          gh release create "$tag" "$archive" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EG v${version} — Stable Production Source" \
            --notes "CI validated source, signature E2E, offline portable relocation, and clean-container dependencies. Live deployment requires separate trusted signing authority and durable state." \
            --latest
